name: Generate and Deploy KG Rankings

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # Runs every Monday at 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ranking pipeline
        run: |
          python kg_ranking.py \
            --start-year 2021 \
            --end-year 2026 \
            --top-n 200

      - name: Check generated output
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Repository files ====="
          find . -maxdepth 3 -type f | sort

          echo "===== Output directory ====="
          ls -lah output

          echo "===== Generated HTML file ====="
          test -f output/kg_rankings.html

          echo "===== HTML file size ====="
          wc -c output/kg_rankings.html

      - name: Prepare GitHub Pages files
        run: |
          rm -rf docs
          mkdir -p docs
          cp output/kg_rankings.html docs/index.html

      - name: Check Pages files
        run: |
          echo "===== Docs directory ====="
          ls -lah docs

          echo "===== Index file size ====="
          wc -c docs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
