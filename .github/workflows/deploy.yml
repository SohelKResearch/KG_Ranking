name: Generate and Deploy KG Rankings

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # Run every Monday at 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Setup Python
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------
      # Run data collection
      # ----------------------------------------------------
      - name: Collect KG publication data
        env:
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: |
          python fetch.py \
            --start-year 2015 \
            --end-year 2026

      # ----------------------------------------------------
      # Generate HTML ranking website
      # ----------------------------------------------------
      - name: Generate KG rankings website
        run: |
          python export.py \
            --start-year 2015 \
            --end-year 2026 \
            --output kg_rankings.html

      # ----------------------------------------------------
      # Prepare GitHub Pages directory
      # ----------------------------------------------------
      - name: Prepare website files
        run: |
          mkdir -p site
          cp kg_rankings.html site/index.html

      # ----------------------------------------------------
      # Upload website artifact
      # ----------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ----------------------------------------------------
      # Deploy to GitHub Pages
      # ----------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
